components:
  schemas:
    Country:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }

    State:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        country_id: { type: integer }

    SignupRequest:
      type: object
      required:
        [code, name, surname, email, username, password, country_id, state_id]
      properties:
        code: { type: integer, example: 123456 }
        name: { type: string, example: Gustavo }
        surname: { type: string, example: Calderón }
        email: { type: string, format: email, example: tavo@ercom.tech }
        username: { type: string, example: tavo.tech }
        password: { type: string, format: password, example: pass1234 }
        country_id: { type: integer, example: 1 }
        state_id: { type: integer, example: 1 }

    LoginRequest:
      type: object
      required: [user, password]
      properties:
        user: { type: string, example: gcalderon.7 }
        password:
          { type: string, format: password, example: tesxuc-futpAm-qitna3 }

    Participant:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        surname: { type: string }
        email: { type: string }
        username: { type: string }

    Sport:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        key: { type: string }
        description: { type: string }
        url: { type: string }
        url_disabled: { type: string }

    Tournament:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        key: { type: string }
        description: { type: string }
        crest_url: { type: string }
        current_round: { type: boolean }
        current: { type: boolean }

    Team:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        key: { type: string }
        seed: { type: integer }
        streak_multiplier: { type: integer }
        play_in_team: { type: boolean }
        selected: { type: boolean }
        crest_url: { type: string }

    PortfolioTeam:
      type: object
      required: [id, seed, streak_multiplier]
      properties:
        id: { type: integer, example: 145 }
        seed: { type: integer, example: 1 }
        streak_multiplier: { type: integer, example: 1 }

    Portfolio:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        tournament_id: { type: integer }
        participant_id: { type: integer }
        championship_points: { type: integer }
        available: { type: boolean }
        teams:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioTeam"

    PortfolioCreateRequest:
      type: object
      required: [tournament_id, participant_id, championship_points, teams]
      properties:
        tournament_id: { type: integer, example: 2 }
        participant_id: { type: integer, example: 134 }
        championship_points: { type: integer, example: 0 }
        teams:
          type: array
          minItems: 5
          items:
            $ref: "#/components/schemas/PortfolioTeam"

    PortfolioUpdateRequest:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioTeam"

    PayOut:
      type: object
      properties:
        place: { type: integer }
        percentage: { type: number, format: float }

    Instruction:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        highlighted: { type: boolean }

    ScoreWeek:
      type: object
      description: |
        Actual shape returned by `score/weeks` and `score/seed/weeks` — not
        to be confused with `Week` above (used by other older report/portfolio
        endpoints).
      properties:
        week: { type: integer, example: 6 }
        label: { type: string, example: "Week 6" }

    ScheduleMatch:
      type: object
      properties:
        home_team: { type: string }
        away_team: { type: string }
        match_date: { type: string, nullable: true, example: "2026-09-21" }
        match_time: { type: string, nullable: true, example: "13:00" }

    SeedTeam:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        seed: { type: integer }
        bye_team_current_week:
          type: boolean
          description: NFL only.

    Wallet:
      type: object
      properties:
        id: { type: integer }
        balance: { type: number, format: float }
        currency: { type: string }

    WalletTotals:
      type: object
      properties:
        sum_in: { type: number, format: float }
        sum_out: { type: number, format: float }
        sum_in_minus_out: { type: number, format: float }

    WalletTransaction:
      type: object
      properties:
        wallet_in: { type: number, format: float }
        wallet_out: { type: number, format: float }
        date: { type: string }
        time: { type: string }
        origin: { type: string }
        portfolio_name: { type: string }
        tournament_name: { type: string }
        sport_hex_color: { type: string }
        canceled: { type: boolean }

    MostPickedTeam:
      type: object
      properties:
        team_name: { type: string }
        times_picked: { type: integer }
        percentage_portfolios: { type: number, format: float }
        tournament_name: { type: string }
        year: { type: integer }

    TeamsNotPicked:
      type: object
      properties:
        team_name: { type: string }
        tournament_name: { type: string }
        year: { type: integer }

    TeamsPickedLog:
      type: object
      properties:
        team_name: { type: string }
        tournament_name: { type: string }
        year: { type: integer }
        times_picked: { type: integer }
        percentage_portfolios: { type: number, format: float }
        round_eliminated: { type: integer }

    TeamsPerYearLog:
      type: object
      properties:
        year: { type: integer }
        teams: { type: integer }
        tournament_id: { type: integer }

    TeamPerfectPortfolios:
      type: object
      properties:
        year: { type: integer }
        tournament_id: { type: integer }
        total_weight: { type: number, format: float }
        total_points: { type: number, format: float }
        tournament_name: { type: string }
