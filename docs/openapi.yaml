openapi: 3.0.3
info:
  title: PortfolioPool API
  description: |
    API for managing portfolios, participants, sports, and tournaments.

    ## Sport identifiers
    | Sport       | `sport` param | sport_id |
    |-------------|---------------|----------|
    | NCAA Male   | `ncaa`        | 1        |
    | NCAA Female | `ncaa`        | 3        |
    | EPL         | `epl`         | 2        |
    | World Cup   | `world-cup`   | 4        |
    | NFL         | `nfl`         | 5 (pending backend confirmation) |

  version: 3.2.0
  contact:
    email: jonhgx@gmail.com

servers:
  - url: https://portfolio-pool-test.damnserver.com:443
    description: Test environment

tags:
  - name: Auth
    description: Authentication, registration, countries and user management.
  - name: NCAA Male - Home
    description: Home screen — `sport=ncaa`, sport_id 1.
  - name: NCAA Male - Portfolios
    description: Portfolio CRUD for NCAA Men's Basketball.
  - name: NCAA Male - Stats
    description: Score and stats for NCAA Men's Basketball.
  - name: NCAA Male - History
    description: Historical reports for NCAA Men's Basketball.
  - name: NCAA Female - Home
    description: Home screen — `sport=ncaa`, sport_id 3.
  - name: NCAA Female - Portfolios
    description: Portfolio CRUD for NCAA Women's Basketball.
  - name: NCAA Female - Stats
    description: Score and stats for NCAA Women's Basketball.
  - name: NCAA Female - History
    description: Historical reports for NCAA Women's Basketball.
  - name: EPL - Home
    description: Home screen — `sport=epl`.
  - name: EPL - Portfolios
    description: Portfolio CRUD for the English Premier League.
  - name: EPL - Stats
    description: Score and stats for the English Premier League.
  - name: World Cup - Home
    description: Home screen — `sport=wc`, sport_id 4.
  - name: World Cup - Portfolios
    description: Portfolio CRUD for FIFA World Cup.
  - name: World Cup - Stats
    description: Score and stats for FIFA World Cup, by group round.
  - name: World Cup - History
    description: Historical reports for FIFA World Cup (not wired up in the frontend yet).
  - name: NFL - Home
    description: Home screen — `sport=nfl`, sport_id 5 (pending backend confirmation).
  - name: NFL - Portfolios
    description: |
      Portfolio CRUD for NFL, weekly (like EPL) plus bye-week team selection
      (a team on its bye week can still be picked as an "extra" slot if it was
      already selected the week before it went on bye).
  - name: NFL - Stats
    description: Score and stats for NFL — Portfolio, Schedule and Seed data views.
  - name: NFL - History
    description: Historical reports for NFL.

x-tagGroups:
  - name: Auth
    tags: [Auth]
  - name: NCAA Male
    tags:
      [
        NCAA Male - Home,
        NCAA Male - Portfolios,
        NCAA Male - Stats,
        NCAA Male - History,
      ]
  - name: NCAA Female
    tags:
      [
        NCAA Female - Home,
        NCAA Female - Portfolios,
        NCAA Female - Stats,
        NCAA Female - History,
      ]
  - name: EPL
    tags: [EPL - Home, EPL - Portfolios, EPL - Stats]
  - name: World Cup
    tags:
      [
        World Cup - Home,
        World Cup - Portfolios,
        World Cup - Stats,
        World Cup - History,
      ]
  - name: NFL
    tags: [NFL - Home, NFL - Portfolios, NFL - Stats, NFL - History]

paths:
  /countries:
    get:
      tags: [Auth]
      summary: Get all countries
      responses:
        "200":
          description: List of countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Country"

  /countries/{countryId}/states:
    get:
      tags: [Auth]
      summary: Get states by country
      parameters:
        - name: countryId
          in: path
          required: true
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: List of states
          content:
            application/json:
              schema:
                type: object
                properties:
                  states:
                    type: array
                    items:
                      $ref: "#/components/schemas/State"

  /participants/signup:
    post:
      tags: [Auth]
      summary: Sign up new participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Participant created
        "400":
          description: Invalid input

  /participants/login:
    post:
      tags: [Auth]
      summary: Login participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant:
                    $ref: "#/components/schemas/Participant"
        "401":
          description: Invalid credentials

  /participants/forgot:
    post:
      tags: [Auth]
      summary: Forgot password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { type: string, example: gcalderon.7 }
      responses:
        "200":
          description: Reset email sent

  /sports:
    get:
      tags: [Auth]
      summary: Get all sports
      responses:
        "200":
          description: List of sports
          content:
            application/json:
              schema:
                type: object
                properties:
                  sports:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sport"

  /participants/{participantId}/sports:
    get:
      tags: [Auth]
      summary: Get sports for a participant
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: integer }
          example: 121
      responses:
        "200":
          description: Sports list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sports:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sport"

  /participants/{participantId}/wallet:
    get:
      tags: [Auth]
      summary: Get participant wallet
      description: |
        Not currently called by the frontend — superseded by the three
        specific endpoints below (`wallet-remaining`, `wallet-totals`,
        `wallet-transactions`), used by the shared `WalletModal` component.
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: integer }
          example: 121
      responses:
        "200":
          description: Wallet data
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    type: array
                    items:
                      $ref: "#/components/schemas/Wallet"

  /participants/{participantId}/wallet-remaining:
    get:
      tags: [Auth]
      summary: Get participant's remaining wallet balance
      description: Used to check funds before confirming a portfolio purchase.
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: integer }
          example: 121
      responses:
        "200":
          description: Remaining balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet_remaining: { type: number, format: float, example: 50.0 }

  /participants/{participantId}/wallet-totals:
    get:
      tags: [Auth]
      summary: Get participant's wallet totals (in/out)
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: integer }
          example: 121
      responses:
        "200":
          description: Totals in/out
          content:
            application/json:
              schema:
                type: object
                properties:
                  totals:
                    type: array
                    items:
                      $ref: "#/components/schemas/WalletTotals"

  /participants/{participantId}/wallet-transactions:
    get:
      tags: [Auth]
      summary: Get participant's wallet transaction history
      description: Response is the array directly (not wrapped in an object).
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: integer }
          example: 121
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletTransaction"

  /participants/{participantId}/buy-portfolio:
    post:
      tags: [Auth]
      summary: Buy a portfolio (charge the wallet)
      description: |
        Called right after `POST /portfolios` creates a new portfolio, to
        charge its price (`PRCXPO` tournament parameter) against the
        participant's wallet. If this fails, the frontend soft-removes the
        just-created portfolio via `PUT /portfolios/{id}/remove`.
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: integer }
          example: 1
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 3
        - name: portfolio_id
          in: query
          required: true
          schema: { type: integer }
          example: 123
      responses:
        "200":
          description: Purchase result
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  success: { type: boolean }
                  message: { type: string }
                  amount: { type: number, format: float }
                  required: { type: number, format: float }
                  available: { type: number, format: float }

  /participants/{participantId}/remove-portfolio:
    post:
      tags: [Auth]
      summary: Refund/cancel a portfolio purchase
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: integer }
          example: 1
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 3
        - name: portfolio_id
          in: query
          required: true
          schema: { type: integer }
          example: 123
      responses:
        "200":
          description: Portfolio purchase removed

  /participants/{participantId}/show-terms-of-use:
    get:
      tags: [Auth]
      summary: Check if terms-of-use must be shown — World Cup only
      description: |
        Triggered from the Login view. Always called with `?sport=wc` — World
        Cup is the only sport with a terms-of-use gate today.
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: integer }
          example: 121
        - name: sport
          in: query
          required: true
          schema: { type: string, enum: [wc] }
          example: wc
      responses:
        "200":
          description: Terms-of-use status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enable_terms_of_use: { type: boolean }
                  accepted_terms_of_use: { type: boolean }
                  tournament_id: { type: integer }

  /participants/{participantId}/accept-terms-of-use:
    post:
      tags: [Auth]
      summary: Accept terms-of-use — World Cup only
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: integer }
          example: 121
        - name: sport
          in: query
          required: true
          schema: { type: string, enum: [wc] }
          example: wc
      responses:
        "200":
          description: Terms-of-use accepted

  /sports/{sportId}/tournaments:
    get:
      tags:
        [
          NCAA Male - Home,
          NCAA Female - Home,
          EPL - Home,
          World Cup - Home,
          NFL - Home,
        ]
      summary: Get tournaments by sport
      description: |
        - NCAA Male: `sportId=1`
        - NCAA Female: `sportId=3`
        - EPL: `sportId=2`
        - NFL: `sportId=5` (pending backend confirmation)
      parameters:
        - name: sportId
          in: path
          required: true
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: List of tournaments
          content:
            application/json:
              schema:
                type: object
                properties:
                  tournaments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tournament"

  /tournaments/{tournamentId}:
    get:
      tags:
        [
          NCAA Male - Home,
          NCAA Female - Home,
          EPL - Home,
          World Cup - Home,
          NFL - Home,
        ]
      summary: Get tournament detail
      description: Not currently called directly by the frontend (present in the backend/Postman collection).
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: Tournament detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{tournamentId}/stats:
    get:
      tags:
        [
          NCAA Male - Home,
          NCAA Female - Home,
          EPL - Home,
          World Cup - Home,
          NFL - Home,
        ]
      summary: Get tournament stats / participant count
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 2
      responses:
        "200":
          description: Tournament statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      participants: { type: integer }

  /tournaments/{tournamentId}/parameters:
    get:
      tags:
        [
          NCAA Male - Home,
          NCAA Female - Home,
          EPL - Home,
          World Cup - Home,
          NFL - Home,
          NFL - Portfolios,
          NFL - Stats,
        ]
      summary: Get tournament parameter by key
      description: |
        Common keys: `POPONA`, `HOINFO`, `DATTOU`, `HOUTOU`, `RECODE`,
        `TEAMXP` (EPL/NFL — team slots per portfolio), `WEETOU` (EPL/NFL — current week),
        `BYTEPO` (NFL only — max bye-week teams selectable per portfolio),
        `PORTXP` (World Cup — portfolio XP), `PRCXPO` (all sports — portfolio price, used for wallet balance check)
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 2
        - name: key
          in: query
          required: true
          schema:
            type: string
            enum:
              [POPONA, HOINFO, DATTOU, HOUTOU, RECODE, TEAMXP, WEETOU, BYTEPO, PORTXP, PRCXPO]
          example: POPONA
      responses:
        "200":
          description: Parameter value
          content:
            application/json:
              schema:
                type: object
                properties:
                  value: { type: string }

  /tournaments/{tournamentId}/instructions:
    get:
      tags:
        [
          NCAA Male - Home,
          NCAA Female - Home,
          EPL - Home,
          World Cup - Home,
          NFL - Home,
        ]
      summary: Get tournament instructions
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 2
      responses:
        "200":
          description: Instructions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  instructions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instruction"

  /tournaments/{tournamentId}/payouts:
    get:
      tags:
        [
          NCAA Male - Home,
          NCAA Female - Home,
          EPL - Home,
          World Cup - Home,
          NFL - Home,
        ]
      summary: Get tournament payouts
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 2
        - name: portfolios
          in: query
          schema: { type: integer }
          example: 223
      responses:
        "200":
          description: Payout distribution
          content:
            application/json:
              schema:
                type: object
                properties:
                  payouts:
                    type: array
                    items:
                      $ref: "#/components/schemas/PayOut"

  /tournaments/{tournamentId}/score/home:
    get:
      tags:
        [
          NCAA Male - Home,
          NCAA Female - Home,
          EPL - Home,
          World Cup - Home,
          NFL - Home,
        ]
      summary: Get home screen score
      description: |
        - **NCAA Male/Female:** `?participant_id={id}&sport=ncaa`
        - **EPL:** `?participant_id={id}&sport=epl`
        - **World Cup:** `?participant_id={id}&sport=wc`
        - **NFL:** `?participant_id={id}&sport=nfl`
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 4
        - name: participant_id
          in: query
          schema: { type: integer }
          example: 121
        - name: sport
          in: query
          schema:
            type: string
            enum: [ncaa, epl, wc, nfl]
          example: ncaa
      responses:
        "200":
          description: Home score data

  /tournaments/{tournamentId}/portfolios/home:
    get:
      tags: [World Cup - Home]
      summary: Get participant's home portfolios — World Cup only
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 6
        - name: participant_id
          in: query
          required: true
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: Home portfolios data

  /tournaments/{tournamentId}/terms-of-use:
    get:
      tags: [Auth]
      summary: Get terms-of-use text — World Cup only
      description: Triggered from the Login view, always with `?sport=wc`.
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 3
        - name: sport
          in: query
          required: true
          schema: { type: string, enum: [wc] }
          example: wc
      responses:
        "200":
          description: Terms-of-use paragraphs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        description: { type: string }
                        highlighted: { type: boolean }

  /participants/{participantId}/portfolios:
    get:
      tags:
        [
          NCAA Male - Portfolios,
          NCAA Female - Portfolios,
          EPL - Portfolios,
          World Cup - Portfolios,
          NFL - Portfolios,
        ]
      summary: Get participant portfolios
      description: |
        - **NCAA:** `?tournament_id={id}&sport=ncaa`
        - **EPL:** `?tournament_id={id}&sport=epl` (add `&portfolio_id={id}` to filter by portfolio)
        - **World Cup:** `?tournament_id={id}&sport=wc`
        - **NFL:** `?tournament_id={id}&sport=nfl`
      parameters:
        - name: participantId
          in: path
          required: true
          schema: { type: integer }
          example: 121
        - name: tournament_id
          in: query
          schema: { type: integer }
          example: 2
        - name: sport
          in: query
          schema:
            type: string
            enum: [ncaa, epl, wc]
          example: ncaa
        - name: portfolio_id
          in: query
          description: EPL only — filter by portfolio
          schema: { type: integer }
          example: 566
      responses:
        "200":
          description: List of portfolios
          content:
            application/json:
              schema:
                type: object
                properties:
                  portfolios:
                    type: array
                    items:
                      $ref: "#/components/schemas/Portfolio"

  /portfolios:
    post:
      tags:
        [
          NCAA Male - Portfolios,
          NCAA Female - Portfolios,
          EPL - Portfolios,
          World Cup - Portfolios,
          NFL - Portfolios,
        ]
      summary: Create portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioCreateRequest"
      responses:
        "201":
          description: Portfolio created
        "400":
          description: Invalid input

  /portfolios/{portfolioId}:
    put:
      tags:
        [
          NCAA Male - Portfolios,
          EPL - Portfolios,
          World Cup - Portfolios,
          NFL - Portfolios,
        ]
      summary: Update portfolio
      description: |
        Not available for NCAA Female (female only creates/removes portfolios, never edits).

        Body shape differs by sport:
        - **NCAA Male / World Cup:** full object, same shape as `POST /portfolios` (`PortfolioCreateRequest`).
        - **EPL / NFL:** `{ teams: [...] }` only (`PortfolioUpdateRequest`).
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema: { type: integer }
          example: 570
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PortfolioUpdateRequest"
                - $ref: "#/components/schemas/PortfolioCreateRequest"
      responses:
        "200":
          description: Portfolio updated
        "404":
          description: Not found
    delete:
      tags:
        [
          NCAA Male - Portfolios,
          NCAA Female - Portfolios,
          World Cup - Portfolios,
        ]
      summary: Delete portfolio
      description: Not used by EPL (EPL uses PUT /remove).
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema: { type: integer }
          example: 565
      responses:
        "204":
          description: Portfolio deleted
        "404":
          description: Not found

  /tournaments/{tournamentId}/teams:
    get:
      tags: [NCAA Male - Portfolios, NCAA Female - Portfolios]
      summary: Get teams available for a tournament
      description: |
        - **NCAA:** `?sport=ncaa&show_all=false`

        Not used by EPL or World Cup — both use `GET /sports/{sportId}/teams` instead.
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 3
        - name: sport
          in: query
          schema:
            type: string
            enum: [ncaa]
          example: ncaa
        - name: show_all
          in: query
          schema: { type: boolean }
          example: false
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"

  /sports/{sportId}/teams/not-available:
    get:
      tags:
        [
          NCAA Male - Portfolios,
          NCAA Female - Portfolios,
          EPL - Portfolios,
          World Cup - Portfolios,
          NFL - Portfolios,
        ]
      summary: Get teams not available for selection
      parameters:
        - name: sportId
          in: path
          required: true
          schema: { type: integer }
          example: 3
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 5
      responses:
        "200":
          description: Unavailable teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"

  /tournaments/{tournamentId}/winner-of-team:
    get:
      tags:
        [
          NCAA Male - Portfolios,
          NCAA Female - Portfolios,
          World Cup - Portfolios,
        ]
      summary: Get winner-of-team options
      description: |
        - **NCAA:** `?sport=ncaa&limit=99`
        - **World Cup:** `?sport=world-cup&limit=99`
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 2
        - name: sport
          in: query
          schema: { type: string }
          example: ncaa
        - name: limit
          in: query
          schema: { type: integer }
          example: 99
      responses:
        "200":
          description: Winner-of-team data

  /tournaments/{tournamentId}/winner-of-team-has-team:
    get:
      tags:
        [
          NCAA Male - Portfolios,
          NCAA Female - Portfolios,
          World Cup - Portfolios,
        ]
      summary: Get teams under a winner-of-team group
      description: |
        - **NCAA:** `?sport=ncaa&winner_of_team_id={id}`
        - **World Cup:** `?team_id={id}`
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 2
        - name: sport
          in: query
          schema: { type: string }
          example: ncaa
        - name: winner_of_team_id
          in: query
          schema: { type: integer }
          example: 1
        - name: team_id
          in: query
          description: World Cup only
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: Teams under the group

  /portfolios/{portfolioId}/per-week:
    get:
      tags: [EPL - Portfolios, NFL - Portfolios, NFL - Home]
      summary: Get portfolio by gameweek
      description: |
        - **EPL:** used by the Portfolios view.
        - **NFL:** used both by Home (weekly score breakdown) and by the
          Portfolios view to get real seed/multiplier for bye-week teams.
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema: { type: integer }
          example: 566
        - name: week
          in: query
          required: true
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: Portfolio teams for the week
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"

  /portfolios/{portfolioId}/remove:
    put:
      tags:
        [
          NCAA Male - Portfolios,
          NCAA Female - Portfolios,
          EPL - Portfolios,
          World Cup - Portfolios,
          NFL - Portfolios,
        ]
      summary: Soft-remove portfolio from tournament
      description: |
        Standard soft-delete used by all 4 sports (unregisters the portfolio from the
        tournament without deleting the record). `DELETE /portfolios/{id}` is the
        harder, permanent alternative — see below.
      parameters:
        - name: portfolioId
          in: path
          required: true
          schema: { type: integer }
          example: 266
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 3
      responses:
        "200":
          description: Portfolio removed

  /sports/{sportId}/teams/dynamics:
    get:
      tags: [EPL - Portfolios, NFL - Portfolios]
      summary: Get team dynamics — EPL and NFL
      description: Dynamic team availability based on current standings.
      parameters:
        - name: sportId
          in: path
          required: true
          schema: { type: integer }
          example: 2
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 3
        - name: portfolio_id
          in: query
          required: true
          schema: { type: integer }
          example: 561
      responses:
        "200":
          description: Team dynamics data

  /sports/{sportId}/teams/schedule-per-week:
    get:
      tags: [EPL - Stats, NFL - Stats]
      summary: Get the week's schedule (matches) — Stats "Schedule" data view
      parameters:
        - name: sportId
          in: path
          required: true
          schema: { type: integer }
          example: 2
        - name: sport
          in: query
          required: true
          schema: { type: string, enum: [epl, nfl] }
          example: epl
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 3
        - name: week
          in: query
          required: true
          schema: { type: integer }
          example: 6
      responses:
        "200":
          description: Matches for the week
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScheduleMatch"

  /sports/{sportId}/teams/seed-per-week:
    get:
      tags: [EPL - Stats, NFL - Stats]
      summary: Get seed per team for the week — Stats "Seed" data view
      parameters:
        - name: sportId
          in: path
          required: true
          schema: { type: integer }
          example: 2
        - name: sport
          in: query
          required: true
          schema: { type: string, enum: [epl, nfl] }
          example: epl
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 3
        - name: week
          in: query
          required: true
          schema: { type: integer }
          example: 6
      responses:
        "200":
          description: Seed per team for the week
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeedTeam"

  /sports/{sportId}/teams/available-bye-teams-per-portfolio:
    get:
      tags: [NFL - Portfolios]
      summary: Get bye-week teams eligible for a portfolio — NFL only
      description: |
        Teams on their bye week that can still be picked as an "extra" slot in
        this specific portfolio, because they were already selected the week
        before they went on bye. Combined on the frontend with the `BYTEPO`
        tournament parameter (max bye teams selectable per portfolio).
      parameters:
        - name: sportId
          in: path
          required: true
          schema: { type: integer }
          example: 5
        - name: sport
          in: query
          required: true
          schema: { type: string, enum: [nfl] }
          example: nfl
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 10
        - name: portfolio_id
          in: query
          required: true
          schema: { type: integer }
          example: 926
      responses:
        "200":
          description: Bye-week teams available for this portfolio
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        team_id: { type: integer }

  /sports/{sportId}/teams:
    get:
      tags:
        [
          NCAA Male - Stats,
          NCAA Female - Stats,
          EPL - Portfolios,
          EPL - Stats,
          World Cup - Portfolios,
          NFL - Portfolios,
          NFL - Stats,
        ]
      summary: Get teams by sport
      description: |
        - **NCAA:** `sportId=1|3`, `?sport=ncaa&tournament_id={id}` — Stats view.
        - **EPL:** `sportId=2`, `?sport=epl&tournament_id={id}` — used by both Portfolios and Stats views.
        - **World Cup:** `sportId=4` (hardcoded in the frontend pending backend confirmation), `?sport=wc&tournament_id={id}` — Portfolios view.
        - **NFL:** `sportId=5` (pending backend confirmation), `?sport=nfl&tournament_id={id}` — used by both Portfolios and Stats views.
      parameters:
        - name: sportId
          in: path
          required: true
          schema: { type: integer }
          example: 2
        - name: sport
          in: query
          schema:
            type: string
            enum: [ncaa, epl, wc, nfl]
          example: ncaa
        - name: tournament_id
          in: query
          schema: { type: integer }
          example: 2
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"

  /tournaments/{tournamentId}/score/stats:
    get:
      tags: [NCAA Male - Stats, NCAA Female - Stats]
      summary: Get team pick stats by round
      description: How many times each team was picked per round. NCAA only.
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 2
        - name: sport
          in: query
          schema: { type: string }
          example: ncaa
        - name: round
          in: query
          schema: { type: integer }
          example: 1
        - name: order
          in: query
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: Score statistics

  /tournaments/{tournamentId}/score/weeks:
    get:
      tags: [NCAA Male - Stats, EPL - Stats, NFL - Stats]
      summary: Get available score weeks
      description: |
        NFL uses this one for the Stats "Portfolio" data view specifically —
        see `score/seed/weeks` below for the weeks list used by the
        "Schedule"/"Seed" data views (NFL and EPL).
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 3
      responses:
        "200":
          description: List of scored weeks
          content:
            application/json:
              schema:
                type: object
                properties:
                  weeks:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScoreWeek"

  /tournaments/{tournamentId}/score/seed/weeks:
    get:
      tags: [EPL - Stats, NFL - Stats]
      summary: Get available weeks for the Schedule/Seed data views
      description: |
        Generic weeks list shared by `schedule-per-week` and `seed-per-week`
        above — separate from `score/weeks`, which feeds the Stats
        "Portfolio" data view instead.
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 10
        - name: sport
          in: query
          required: true
          schema: { type: string, enum: [epl, nfl] }
          example: nfl
      responses:
        "200":
          description: List of available weeks
          content:
            application/json:
              schema:
                type: object
                properties:
                  weeks:
                    type: array
                    items:
                      $ref: "#/components/schemas/ScoreWeek"

  /tournaments/{tournamentId}/score/stats/portfolio:
    get:
      tags: [NCAA Male - Stats]
      summary: Get portfolio stats by week
      description: |
        NCAA Male only — EPL and NFL call the plural `score/stats/portfolios`
        path above instead (same purpose, different path).
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 3
        - name: week
          in: query
          schema: { type: integer }
          example: 6
      responses:
        "200":
          description: Portfolio statistics per week

  /tournaments/{tournamentId}/score/stats/portfolios:
    get:
      tags: [World Cup - Home, World Cup - Stats, EPL - Stats, NFL - Stats]
      summary: Get portfolio team composition (plural) — shared by EPL, NFL and World Cup
      description: |
        Same path used three ways depending on sport:
        - **EPL / NFL:** `?week={week}` — the Stats "Portfolio" data view.
          Functionally equivalent to `score/stats/portfolio` (singular) below,
          just under the plural path — NCAA Male is the only sport still on
          the singular one.
        - **World Cup:** `?round={round}&sport=wc` — keyed by group round
          instead of week. Used by the Home view (fixed at `round=1`, the
          first group round) to render team compositions, and by the Stats
          view for the selected round.
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 4
        - name: week
          in: query
          description: EPL / NFL only
          schema: { type: integer }
          example: 6
        - name: round
          in: query
          description: World Cup only
          schema: { type: string }
          example: "1"
        - name: sport
          in: query
          description: World Cup only — EPL/NFL don't send this param here
          schema: { type: string, enum: [wc] }
          example: wc
      responses:
        "200":
          description: Portfolio team composition, per week (EPL/NFL) or round (World Cup)

  /tournaments/{tournamentId}/score/rounds:
    get:
      tags: [World Cup - Stats]
      summary: Get available group rounds — World Cup only
      description: |
        Rounds dropdown data. Response shape: `[{ consecutive: 3, round: "GROUP ROUND 3" }]`
        — `consecutive` is the numeric value sent back as `round` in other endpoints,
        `round` is the display label.
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 4
        - name: sport
          in: query
          required: true
          schema: { type: string, enum: [wc] }
          example: wc
      responses:
        "200":
          description: List of group rounds

  /tournaments/{tournamentId}/match-probabilities:
    get:
      tags: [World Cup - Portfolios]
      summary: Get match win probabilities by group — World Cup only
      description: Used in the portfolio tab to help pick teams within a group.
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 4
        - name: sport
          in: query
          required: true
          schema: { type: string, enum: [wc] }
          example: wc
        - name: group
          in: query
          required: true
          schema: { type: string }
          example: A
      responses:
        "200":
          description: Match probabilities for the group

  /tournaments/{tournamentId}/score/points-per-round:
    get:
      tags: [NCAA Male - Stats, NCAA Female - Stats]
      summary: Get points per round
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: integer }
          example: 2
        - name: sport
          in: query
          schema: { type: string }
          example: ncaa
      responses:
        "200":
          description: Points per round data

  /reports/most-picked-teams:
    get:
      tags: [NCAA Male - Stats, NCAA Female - Stats]
      summary: Get most picked teams
      parameters:
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
