      responses:
        "200":
          description: Teams not picked log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamsNotPicked"

  /reports/teams-picked-log:
    get:
      tags: [NCAA Male - Stats, NCAA Female - Stats]
      summary: Get teams picked log
      parameters:
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 2
      responses:
        "200":
          description: Teams picked log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamsPickedLog"

  /reports/seed-pick-totals:
    get:
      tags: [NCAA Male - Stats, NCAA Female - Stats]
      summary: Get seed pick totals
      parameters:
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: Seed pick totals

  /reports/portfolio-seed-selections:
    get:
      tags: [NCAA Male - Stats, NCAA Female - Stats]
      summary: Get portfolio seed selections
      parameters:
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: Portfolio seed selections

  /reports/teams-per-year-log:
    get:
      tags:
        [
          NCAA Male - History,
          NCAA Female - History,
          World Cup - History,
          NFL - History,
        ]
      summary: Get teams per year log
      parameters:
        - name: tournament_id
          in: query
          required: true
          schema: { type: integer }
          example: 1
      responses:
        "200":
          description: Teams per year log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeamsPerYearLog"

  /reports/historical-perfect-portfolios-header:
    get:
      tags:
        [
